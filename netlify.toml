# Static hosting for the dashboard (free plan: no functions are used). The API runs on Supabase (docs/DEPLOY.md);
# /api, /apk and /healthz are proxied there at the CDN level, which keeps phones on the old address working (agent 1.3.x)
# and lets the dashboard use same-origin cookies. Replace the project ref below if you deploy to a new Supabase project.
[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://qzkoowbcngcdnhqystwz.supabase.co/functions/v1/kiosk/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/apk/*"
  to = "https://qzkoowbcngcdnhqystwz.supabase.co/functions/v1/kiosk/apk/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "https://qzkoowbcngcdnhqystwz.supabase.co/functions/v1/kiosk/healthz"
  status = 200
  force = true

[[redirects]]
  from = "/kiosk-agent.apk"
  to = "https://qzkoowbcngcdnhqystwz.supabase.co/storage/v1/object/public/apk/kiosk-agent.apk"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://qzkoowbcngcdnhqystwz.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/setup/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Content-Disposition = "attachment"

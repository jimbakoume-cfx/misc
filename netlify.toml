# RETIRED. The dashboard moved to Cloudflare Workers on 24 November 2026 (see cloudflare/ and docs/DEPLOY.md):
#   https://confiance-kiosk.jim-bakoume.workers.dev
# This file only keeps the old address useful while the Netlify site still exists: every request is redirected to the
# new address, so old bookmarks and documents keep working and nobody else can reuse the name for a look-alike page.
# Delete this file once the Netlify site itself has been deleted.
[build]
  publish = "netlify-retired"

[[redirects]]
  from = "/*"
  to = "https://confiance-kiosk.jim-bakoume.workers.dev/:splat"
  status = 301
  force = true

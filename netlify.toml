# Transitional Netlify site: the dashboard and API now live on Supabase (docs/DEPLOY.md).
# This site only proxies phones that still use the old address (agent 1.3.x) to the new backend, and redirects
# people to the new dashboard. Set KIOSK_UPSTREAM (Site configuration → Environment variables) to the Supabase
# function URL, e.g. https://<ref>.supabase.co/functions/v1/kiosk. Delete the site once every phone runs 1.4.0+.
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/kiosk-agent.apk"
  to = "https://qzkoowbcngcdnhqystwz.supabase.co/storage/v1/object/public/apk/kiosk-agent.apk"
  status = 302

[[redirects]]
  from = "/"
  to = "https://qzkoowbcngcdnhqystwz.supabase.co/functions/v1/kiosk/"
  status = 302
  force = true

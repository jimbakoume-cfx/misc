<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confiance Kiosk</title>
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="login" class="card hidden">
  <svg class="mark" viewBox="350 0 492 548" aria-hidden="true"><path d="M804.4 136A227.5 227.5 0 0 0 412.7 361.2M571.2 493.7A227.5 227.5 0 0 0 804.4 408" fill="none" stroke="currentColor" stroke-width="89"/><path fill="currentColor" fill-rule="evenodd" d="M614 155C658 155 695 190 695 235C695 275 665 310 612 362C560 310 535 275 535 235C535 190 570 155 614 155ZM614 197A38 38 0 1 0 614 273A38 38 0 1 0 614 197Z"/><path fill="currentColor" d="M395 428L380 397C420 350 480 325 548 305L548 316C490 340 430 375 395 428ZM505 377C525 360 545 345 565 333L572 345C555 360 540 372 527 380ZM438 472C445 440 460 418 475 402L500 405C480 425 465 450 460 495ZM610 360C540 405 510 460 530 520C540 535 570 540 588 546C555 520 548 470 580 425C595 400 610 385 612 360Z"/></svg>
  <h2>Confiance Kiosk</h2>
  <form id="loginForm">
    <label>Email</label><input id="email" type="email" required autocomplete="username" style="width:100%">
    <label>Password</label><input id="password" type="password" required autocomplete="current-password" style="width:100%">
    <div id="codeRow" class="hidden"><label>6-digit code (or a recovery code)</label><input id="code" inputmode="numeric" autocomplete="one-time-code" style="width:100%"></div>
    <p id="loginErr" class="muted" style="color:var(--bad);min-height:1.2em"></p>
    <button class="btn" style="width:100%">Sign in</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <h1><svg class="mark" viewBox="350 0 492 548" aria-hidden="true"><path d="M804.4 136A227.5 227.5 0 0 0 412.7 361.2M571.2 493.7A227.5 227.5 0 0 0 804.4 408" fill="none" stroke="currentColor" stroke-width="89"/><path fill="currentColor" fill-rule="evenodd" d="M614 155C658 155 695 190 695 235C695 275 665 310 612 362C560 310 535 275 535 235C535 190 570 155 614 155ZM614 197A38 38 0 1 0 614 273A38 38 0 1 0 614 197Z"/><path fill="currentColor" d="M395 428L380 397C420 350 480 325 548 305L548 316C490 340 430 375 395 428ZM505 377C525 360 545 345 565 333L572 345C555 360 540 372 527 380ZM438 472C445 440 460 418 475 402L500 405C480 425 465 450 460 495ZM610 360C540 405 510 460 530 520C540 535 570 540 588 546C555 520 548 470 580 425C595 400 610 385 612 360Z"/></svg> Confiance Kiosk</h1>
    <nav id="nav"></nav>
    <span class="muted" id="who"></span>
    <button class="btn ghost" id="logout">Sign out</button>
  </header>
  <main id="view"></main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast"></div>

<script src="/app.js" defer></script>
</body>
</html>

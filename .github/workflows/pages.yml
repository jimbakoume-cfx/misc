# Hosts the dashboard on GitHub Pages (free) on every push: https://jimbakoume-cfx.github.io/misc/
# The workflow enables Pages on the repository by itself the first time it runs. The page calls the Supabase API
# directly (bearer token sign-in), so KIOSK_API below must be your function URL. Netlify hosting is independent.
name: Publish dashboard to GitHub Pages
on:
  push:
    branches: [claude/h2-kiosk-mode-app-8qsgjt, main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
env:
  KIOSK_API: https://qzkoowbcngcdnhqystwz.supabase.co/functions/v1/kiosk
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Point the dashboard at the API
        run: |
          mkdir -p out && cp -r public/. out/
          sed -i "s#<meta name=\"kiosk-api\" content=\"\">#<meta name=\"kiosk-api\" content=\"$KIOSK_API\">#" out/index.html
          grep -q "$KIOSK_API" out/index.html
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - id: deployment
        uses: actions/deploy-pages@v4
